<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoxelForge 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
:root {
  --bg: #080a12;
  --surface: #101322;
  --stage: #05060b;
  --line: #222845;
  --fg: #eef1fb;
  --muted: #98a2c4;
  --blue: #3b82ff;
  --magenta: #ff3fd0;
  --grad: linear-gradient(100deg, var(--blue), var(--magenta));
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  padding-inline: 20px;
}
a { color: inherit; }
img { max-width: 100%; display: block; }
.wrap { max-width: 1160px; margin-inline: auto; }

/* cabeçalho */
.top {
  position: sticky; top: 0; z-index: 10;
  margin-inline: -20px; padding: 10px 20px;
  background: rgba(8, 10, 18, 0.88);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.brand img { width: 44px; height: 44px; border-radius: 50%; }
.brand b { font-family: var(--display); font-size: 15px; }
.nav { margin-left: auto; display: flex; align-items: center; gap: 22px; font-size: 14px; font-weight: 600; }
.nav a { text-decoration: none; color: var(--muted); }
.nav a:hover { color: var(--fg); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 999px; padding: 12px 22px;
  background: var(--grad); color: #fff;
  font: 700 15px/1.2 var(--body); text-decoration: none; cursor: pointer;
}
.btn.sm { padding: 9px 16px; font-size: 14px; }

/* hero */
.hero { display: grid; grid-template-columns: 1fr 1.05fr; gap: 48px; align-items: center; padding: 56px 0; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }
h1 { font-family: var(--display); font-size: clamp(30px, 4.6vw, 52px); line-height: 1.08; margin-bottom: 20px; }
h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lead { color: var(--muted); font-size: 18px; margin-bottom: 28px; }
.tags { display: flex; gap: 8px; padding: 0; list-style: none; }
.tags li { font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; }

.collage { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.collage img { width: 100%; object-fit: cover; border-radius: 18px; border: 1px solid var(--line); background: var(--stage); }
.collage .a { grid-column: 1 / -1; aspect-ratio: 16 / 9; }
.collage .b, .collage .c { aspect-ratio: 1 / 1; }

/* catálogo */
.section-head { display: flex; justify-content: space-between; align-items: end; padding-top: 40px; border-top: 1px solid var(--line); }
h2 { font-family: var(--display); font-size: 28px; margin-bottom: 6px; }
.sub { color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; padding: 28px 0 56px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; }
.stage { position: relative; aspect-ratio: 4 / 3; background: var(--stage); }
.stage img { width: 100%; height: 100%; object-fit: contain; }
.badge { position: absolute; top: 14px; left: 14px; font-size: 12px; font-weight: 700; text-transform: uppercase; background: rgba(8, 10, 18, .75); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; }
.body { padding: 20px; display: flex; flex-direction: column; gap: 16px; flex: 1; }
.card h3 { font-family: var(--display); font-size: 20px; margin: 0; }
.desc { color: var(--muted); font-size: 15px; margin: 0; }
.buy { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
.price { font-family: var(--display); font-weight: 700; font-size: 22px; }

/* rodapé */
footer { border-top: 1px solid var(--line); padding: 28px 0; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 14px; }
footer img { width: 32px; height: 32px; border-radius: 50%; }

@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#topo"><img data-embed="logo" alt="Logo"><b>VOXELFORGE 3D</b></a>
    <nav class="nav">
      <a href="#catalogo">Catálogo</a>
      <a class="btn sm" id="wa-header" href="#" target="_blank">WhatsApp</a>
    </nav>
  </div>
</header>

<main class="wrap" id="topo">
  <section class="hero">
    <div>
      <p class="eyebrow">Impressão 3D articulada</p>
      <h1>Peças que se mexem de verdade, <em>feitas em 3D</em></h1>
      <p class="lead">Axolotes, cubos e dinos articulados. Escolha o seu e peça pelo WhatsApp.</p>
      <ul class="tags">
        <li>Articulado</li>
        <li>Alta qualidade</li>
      </ul>
    </div>
    <div class="collage">
      <img class="a" data-embed="aqua-hero" alt="">
      <img class="b" data-embed="cubo-hero" alt="">
      <img class="c" data-embed="dino-vermelho" alt="">
    </div>
  </section>

  <section id="catalogo">
    <div class="section-head">
      <div>
        <h2>Catálogo</h2>
        <p class="sub" id="count">Coleções</p>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer class="wrap">
  <img data-embed="logo" alt="">
  <span>VoxelForge 3D</span>
</footer>

document.addEventListener("DOMContentLoaded", () => {
  // Inserir imagens em Base64
  document.querySelectorAll("img[data-embed]").forEach(img => {
    const key = img.getAttribute("data-embed");
    if (IMG[key]) img.src = IMG[key];
  });

  // Configurar links do WhatsApp
  const waNumber = "5519999999999";
  const waHeader = document.getElementById("wa-header");
  if (waHeader) waHeader.href = `https://wa.me/${waNumber}?text=` + encodeURIComponent("Olá! Vim pelo site da VoxelForge 3D e gostaria de fazer um pedido.");

  // Gerar Produtos
  const produtos = [
    { nome: "Axolote Articulado", colecao: "Animais", preco: 45.00, desc: "Axolote flexível impresso em 3D.", imgKey: "aqua-hero" },
    { nome: "Cubo Mágico Antiestresse", colecao: "Geométricos", preco: 35.00, desc: "Cubo articulado infinito.", imgKey: "cubo-hero" },
    { nome: "Dinossauro T-Rex", colecao: "Dinossauros", preco: 55.00, desc: "T-Rex totalmente articulado.", imgKey: "dino-vermelho" }
  ];

  const grid = document.getElementById("grid");
  if (grid) {
    grid.innerHTML = produtos.map(p => `
      <div class="card">
        <div class="stage">
          <span class="badge">${p.colecao}</span>
          <img src="${IMG[p.imgKey] || ''}" alt="${p.nome}">
        </div>
        <div class="body">
          <h3>${p.nome}</h3>
          <p class="desc">${p.desc}</p>
          <div class="buy">
            <span class="price">R$ ${p.preco.toFixed(2).replace('.', ',')}</span>
            <a class="btn sm" href="https://wa.me/${waNumber}?text=${encodeURIComponent('Olá! Quero o produto: ' + p.nome)}" target="_blank">Pedir</a>
          </div>
        </div>
      </div>
    `).join('');
  }
});
</script>
