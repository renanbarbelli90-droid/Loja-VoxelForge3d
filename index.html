<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>VoxelForge 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: cabeçalho fixo, hero com colagem de 3 fotos, filtro por coleção e grade de cartões de produto com seleção de cor, opção e quantidade. */
:root {
  --bg: #080a12;
  --surface: #101322;
  --stage: #05060b;
  --line: #222845;
  --fg: #eef1fb;
  --muted: #98a2c4;
  --blue: #3b82ff;
  --magenta: #ff3fd0;
  --grad: linear-gradient(100deg, var(--blue), var(--magenta));
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  padding-inline: 20px;
}
a { color: inherit; }
img { display: block; }
.wrap { max-width: 1160px; margin-inline: auto; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  margin-inline: -20px; padding: 10px 20px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; min-width: 0; }
.brand img { width: 44px; height: 44px; border-radius: 50%; flex: none; }
.brand b { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .02em; white-space: nowrap; }
.nav { margin-left: auto; display: flex; align-items: center; gap: 22px; font-size: 14px; font-weight: 600; }
.nav a { text-decoration: none; color: var(--muted); }
.nav a:hover { color: var(--fg); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 999px; padding: 12px 22px;
  background: var(--grad); color: #fff;
  font: 700 15px/1.2 var(--body); text-decoration: none; cursor: pointer;
}
.btn:hover { filter: brightness(1.12); }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--fg); }
.btn.ghost:hover { border-color: var(--blue); filter: none; }
.btn.sm { padding: 9px 16px; font-size: 14px; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 48px; align-items: center; padding-block: 56px 48px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 16px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 4.6vw, 52px); line-height: 1.08; margin: 0 0 20px; text-wrap: balance; letter-spacing: -.01em; }
h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lead { color: var(--muted); font-size: 18px; max-width: 46ch; margin: 0 0 28px; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 28px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0; list-style: none; }
.tags li { font-size: 13px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; }

.collage { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-width: 0; }
.collage img { width: 100%; object-fit: cover; border-radius: 18px; border: 1px solid var(--line); background: var(--stage); }
.collage .a { grid-column: 1 / -1; aspect-ratio: 16 / 9; }
.collage .
